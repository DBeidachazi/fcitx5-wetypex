name: 构建

on:
  push:
    branches: [main]
  pull_request:

jobs:
  arch-linux:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: 安装构建依赖
        run: >-
          pacman -Syu --noconfirm git cmake clang boost fcitx5 libime libc++
          json-c curl bubblewrap util-linux python qt6-base qt6-svg
          qt6-webengine pipewire ffmpeg wl-clipboard
      - uses: actions/checkout@v4
      - name: 配置
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - name: 构建
        run: cmake --build build --parallel
      - name: 检查脚本
        run: |
          sh -n scripts/*.in
          python3 -m py_compile scripts/setup_runtime.py tools/*.py
